<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" fill="none">
  <!-- "Hub" text -->
  <text x="0" y="76" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="#FF7A59">Hub</text>

  <!-- "Sp" text -->
  <text x="168" y="76" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="#FF7A59">Sp</text>

  <!-- Sprocket icon replacing "o" (positioned between Sp and t) -->
  <!-- Center circle -->
  <circle cx="148" cy="54" r="17" fill="#FF7A59"/>
  <!-- Top connector -->
  <rect x="145" y="14" width="6" height="18" rx="3" fill="#FF7A59"/>
  <!-- Top dot -->
  <circle cx="148" cy="11" r="7" fill="#FF7A59"/>
  <!-- Left connector -->
  <rect x="112" y="51" width="15" height="6" rx="3" fill="#FF7A59"/>
  <!-- Left dot -->
  <circle cx="109" cy="54" r="5" fill="#FF7A59"/>
  <!-- Right connector -->
  <rect x="165" y="51" width="15" height="6" rx="3" fill="#FF7A59"/>
  <!-- Right dot -->
  <circle cx="183" cy="54" r="5" fill="#FF7A59"/>
  <!-- Inner white -->
  <circle cx="148" cy="54" r="7" fill="white"/>

  <!-- "t" text -->
  <text x="272" y="76" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="#FF7A59">t</text>
</svg>
